<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css rel="stylesheet" integrity="sha384-
QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creacion de Viviendas</title>
</head>

<body>
  <div class="container ">
    <div class="row">
      <div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
        <h1 class="text-center">Agregar vivienda</h1>
        <div class="card-body">
          <form th:action="@{/viviendas}" th:object="${vivienda}" method="POST">
            <div class="form-group">
              <label>Calle: </label>
              <input type="text" name="calle" th:field="*{calle}" class="form-control"
                placeholder="Ingrese el nombre la calle" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" required />
            </div>
            <br />
            <div class="form-group">
              <label>Numero: </label>
              <input type="number" name="numero" min="1" th:field="*{nro}" class="form-control"
                placeholder="Ingrese la altura de la calle" required />
            </div>
            <div class="form-group">
              <label>Titular: </label>
              <input type="text" name="titular" th:field="*{titular}" class="form-control"
                placeholder="Ingrese el titular de la vivienda" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" required />
            </div>
            <div class="form-group">
              <label>Habitantes: </label>
              <input type="number" name="numero" th:field="*{habitantes}" class="form-control"
                placeholder="Ingrese la cantidad de habitantes" min="1" required />
            </div>
            <div class="form-group">
              <label>Propietario: </label>
              <select name="propietario" th:field="*{propietario}" class="form-control" required>
                <option value="" disabled selected>Seleccione un propietario</option>
                <option th:each="propietario : ${propietarios}" th:value="${propietario.id}"
                  th:text="${propietario.nombre}"></option>
              </select>
            </div>
            <div class="form-group">
              <label>Barrio: </label>
              <select name="barrio" th:field="*{barrio}" class="form-control" required>
                <option value="" disabled selected>Seleccione un barrio</option>
                <option th:each="barrio : ${barrios}" th:value="${barrio.id}" th:text="${barrio.nombre}"></option>
              </select>
            </div>
            <br />
            <div class="box-footer">
              <button class="btn btn-success">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
